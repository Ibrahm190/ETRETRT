<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <style>
        body { background: #111; color: #fff; font-family: 'Segoe UI'; padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #333; text-align: right; }
        th { background: #222; }
        .btn-del { color: #ff4d4d; text-decoration: none; }
        .form-add { background: #222; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>لوحة تحكم المدير - أهلاً {{ session['username'] }}</h1>
    <a href="/logout">تسجيل الخروج</a>

    <div class="form-add">
        <h3>إضافة أدمن جديد</h3>
        <form action="/add_admin" method="POST">
            <input type="text" name="username" placeholder="اسم الأدمن الجديد" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">إضافة</button>
        </form>
    </div>

    <h3>إدارة المديرين</h3>
    <table>
        <tr>
            <th>المعرف</th>
            <th>اسم المستخدم</th>
            <th>الرتبة</th>
            <th>إجراءات</th>
        </tr>
        {% for user in users %}
        <tr>
            <td>{{ user.id }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.role }}</td>
            <td>
                {% if user.role != 'super_admin' %}
                <a href="/delete_user/{{ user.id }}" class="btn-del">حذف</a>
                {% endif %}
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
