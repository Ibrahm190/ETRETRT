<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض الصور المحلي</title>
    <!-- ربط مكتبة عرض الصور -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/luminous-lightbox/2.3.2/luminous-basic.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #111; color: #fff; margin: 0; padding: 20px; text-align: center; }
        h1 { color: #fff; margin-bottom: 30px; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        
        /* جعل الصور قابلة للضغط */
        .gallery a { display: block; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; }
        .gallery a:hover { transform: scale(1.05); border: 2px solid #1a73e8; }
        .gallery img { width: 100%; height: 200px; object-fit: cover; display: block; }
        
        /* تحسين شكل الخلفية عند تكبير الصورة */
        .lum-lightbox { background: rgba(0, 0, 0, 0.9); }
    </style>
</head>
<body>
    <h1>المعرض المشترك</h1>
    <div class="gallery">
        {% for image in images %}
            <!-- وضع الصورة داخل رابط لتفعيل التكبير -->
            <a class="zoom-img" href="{{ url_for('display_image', filename=image) }}">
                <img src="{{ url_for('display_image', filename=image) }}" alt="Photo">
            </a>
        {% else %}
            <p>لا توجد صور حالياً.</p>
        {% endfor %}
    </div>

    <!-- كود التشغيل للمكتبة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/luminous-lightbox/2.3.2/Luminous.min.js"></script>
    <script>
        // تشغيل ميزة التكبير على كل الصور التي تحمل كلاس zoom-img
        new LuminousGallery(document.querySelectorAll(".zoom-img"));
    </script>
</body>
</html>
