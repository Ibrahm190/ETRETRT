<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <style>
        body { background: #111; color: #fff; font-family: 'Segoe UI'; display: grid; place-items: center; height: 100vh; }
        .login-box { background: #222; padding: 2rem; border-radius: 10px; border: 1px solid #333; }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; background: #333; color: #fff; border: none; }
        button { background: #007bff; color: #fff; border: none; padding: 10px 20px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>تسجيل دخول الإدارة</h2>
        <form method="POST">
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول</button>
        </form>
    </div>
</body>
</html>
